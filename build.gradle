plugins {
  id 'java-library'
  id 'maven-publish'
  id 'application'
  alias(libs.plugins.spotless)
}

// group, version, author, and copyright are read from gradle.properties - the single source of truth, read
// back at runtime via the jar manifest, see Info.java.
description = 'A general-purpose Java support library'
ext.vendor = author

repositories {
  mavenCentral()
}

dependencies {
  // MailService and its back-ends expose javax.mail types (MessagingException) in their public API:
  api libs.javax.mail

  testImplementation libs.junit.jupiter.api
  testRuntimeOnly    libs.junit.jupiter.engine
  // Gradle 9 no longer bundles the JUnit Platform launcher - must be declared explicitly.
  testRuntimeOnly    libs.junit.platform.launcher
  testImplementation libs.mariadb.client
  testImplementation libs.testcontainers                // SqlPagingTest's MariaDB
  testImplementation libs.testcontainers.junit.jupiter  // SqlPagingTest's MariaDB
  testImplementation libs.testcontainers.mariadb        // SqlPagingTest's MariaDB
  testRuntimeOnly    libs.slf4j.nop                     // Silences Testcontainers' SLF4J "no binding found" warning
}

java {
  // A toolchain (rather than source/targetCompatibility) decouples the JDK used to compile from the JDK
  // running Gradle. Keep in sync with gradle/gradle-daemon-jvm.properties's toolchainVersion.
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
  withJavadocJar()
  withSourcesJar()
}

// Generate HTML5 documentation without doclint diagnostics or Javadoc progress messages.
javadoc {
  options.addBooleanOption('html5', true)
  options.addStringOption('Xdoclint:none', '-quiet')
}

application {
  mainClass = 'com.pellicciotta.support.Info'
}

test {
  useJUnitPlatform()
  testLogging.showStandardStreams = true
}

// Formatting: normalizes whitespace only (trailing whitespace, final newline, tabs-to-spaces), deliberately
// not a full reformatter (googleJavaFormat/eclipse). `check` already depends on `spotlessCheck` via the
// plugin's own wiring.
spotless {
  java {
    target 'src/**/*.java'
    trimTrailingWhitespace()
    endWithNewline()
    leadingTabsToSpaces(2)
  }
  groovyGradle {
    target '*.gradle', 'gradle/*.gradle'
    trimTrailingWhitespace()
    endWithNewline()
    leadingTabsToSpaces(2)
  }
}

// Short commit hash of the current HEAD, or null outside a git checkout (e.g. a source-only tarball build):
def gitCommitHash = {
  try {
    def process = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, projectDir)
    process.waitFor()
    return process.exitValue() == 0 ? process.text.trim() : null
  } catch (IOException ignored) {
    return null
  }
}()

// Implementation-Version carries +<short-commit-hash> build metadata so in-development builds sharing the
// same -pre version stay individually traceable back to the commit that produced them:
def implementationVersion = gitCommitHash ? "${project.version}+${gitCommitHash}" : project.version.toString()

// Stamps the resolved project metadata into the jar manifest so Info.java can read it back at runtime via
// Package.getImplementationVersion() and friends - there is no second hardcoded version/name string to keep
// in sync. Main-Class makes the plain jar directly runnable via `java -jar`.
jar {
  manifest {
    attributes(
      'Main-Class':             application.mainClass.get(),
      'Implementation-Title':   project.name,
      'Implementation-Version': implementationVersion,
      'Implementation-Vendor':  project.ext.vendor,
      'Specification-Title':    project.description,
      'Specification-Vendor':   copyright,
      // Deliberately changes on each configuration: prefer build traceability over identical JAR bytes.
      'Build-Time':             java.time.Instant.now().toString()
    )
  }
}

// Publish in Maven format; see docs/library-publishing.md in java-project-template for the pattern.
def githubRepo = 'gpellicciotta/support.java'
publishing {
  publications {
    maven(MavenPublication) {
      artifactId = project.name
      from components.java
      versionMapping {
        usage('java-api') {
          fromResolutionOf('runtimeClasspath')
        }
        usage('java-runtime') {
          fromResolutionResult()
        }
      }
      pom {
        name = project.name
        description = project.description
        url = "https://github.com/${githubRepo}"
        licenses {
          license {
            name = 'MIT License'
            url = "https://github.com/${githubRepo}/blob/master/LICENSE.md"
          }
        }
        developers {
          developer {
            id = 'giovanni.pellicciotta'
            name = author
            email = 'support@pellicciotta.com'
          }
        }
        scm {
          connection = "scm:git:https://github.com/${githubRepo}.git"
          developerConnection = "scm:git:ssh://git@github.com/${githubRepo}.git"
          url = "https://github.com/${githubRepo}"
        }
      }
    }
  }
  repositories {
    maven {
      name = 'GithubPackages'
      url = uri("https://maven.pkg.github.com/${githubRepo}")
      credentials { // These come from {user.home}/.gradle/gradle.properties or the environment:
        username = project.findProperty("github.username") ?: System.getenv("GITHUB_USERNAME")
        password = project.findProperty("github.token") ?: System.getenv("GITHUB_TOKEN")
      }
    }
  }
}
